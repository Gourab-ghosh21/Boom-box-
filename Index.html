<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Will You Be Mine? 💖</title>
  <script src="https://cdn.tailwindcss.com"></script>
<style>
    body {
      background: linear-gradient(135deg, #ffe4e6, #fff1f2);
    }
    .heart {
      position: absolute;
      color: #fb7185;
      animation: float 6s infinite ease-in-out;
      opacity: 0.8;
    }
  keyframes float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-40px) scale(1.1); }
      100% { transform: translateY(0) scale(1); }
    }
  </style>
@
</head>
<body class="min-h-screen flex items-center justify-center overflow-hidden relative">

  <!-- Floating hearts -->
  <div class="heart text-4xl" style="top:10%; left:15%;">💗</div>
  <div class="heart text-3xl" style="top:30%; left:70%; animation-delay:1s">💖</div>
  <div class="heart text-5xl" style="top:60%; left:20%; animation-delay:2s">💕</div>
  <div class="heart text-4xl" style="top:75%; left:75%; animation-delay:3s">💘</div>
  <div class="bg-white/80 backdrop-blur-md shadow-xl rounded-3xl p-8 max-w-md text-center z-10">
    <h1 class="text-3xl font-bold text-rose-500 mb-4">Hey Love 💕</h1>
    <p class="text-gray-700 text-lg mb-6">
      Every moment with you makes my world brighter, my smile bigger, and my heart fuller.
    </p>

    <p class="text-gray-700 text-lg mb-8 font-medium">
      So I have one very important question for you…
    </p>
    <h2 class="text-4xl font-extrabold text-rose-600 mb-8">
      Will you be my girlfriend? 💖
    </h2>

    <div class="flex justify-center gap-4">
      <button
        onclick="sayYes()"
        class="px-6 py-3 bg-rose-500 hover:bg-rose-600 text-white text-lg rounded-full shadow-md transition">
        Yes 💕
      </button>
      <button
        id="noBtn"
        onmouseover="moveNo()"
        class="px-6 py-3 bg-gray-200 text-gray-600 text-lg rounded-full shadow-md transition">
        No 🙈
      </button>
    </div>
    <p id="response" class="mt-8 text-2xl font-bold text-rose-600 hidden"></p>
  </div>

  <script>
    function sayYes() {
      const response = document.getElementById('response');
      response.textContent = "YAY!! 💕 I’m the happiest person ever 🥰";
      response.classList.remove('hidden');
    }
    function moveNo() {
      const btn = document.getElementById('noBtn');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>

</body>
</html>
